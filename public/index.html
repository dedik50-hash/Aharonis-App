<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>הרשימה של משפחת אהרוני-מרלנג'ון</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f766e">
  
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    :root { --primary: #0d9488; --bg: #f1f5f9; --text: #1e293b; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; text-align: center; }
    .box { background: white; padding: 20px; border-radius: 12px; max-width: 400px; margin: 40px auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <div class="box">
    <h2>🏡 משפחת אהרוני-מרלנג'ון</h2>
    <p id="status">מתחבר...</p>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCbFZpusl3t-e7AHg-Ulq2n2K-nKusgSuw",
      authDomain: "aharoni-s-list.firebaseapp.com",
      projectId: "aharoni-s-list",
      storageBucket: "aharoni-s-list.firebasestorage.app",
      messagingSenderId: "796491469055",
      appId: "1:796491469055:web:d30e52773e76032c933cca"
    };
    firebase.initializeApp(firebaseConfig);
    firebase.auth().signInAnonymously().then(() => {
      document.getElementById('status').innerText = "מסונכרן 🟢";
    }).catch(err => {
      document.getElementById('status').innerText = "שגיאה: " + err.message;
    });
  </script>
</body>
</html>
