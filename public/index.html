<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>הרשימה והמתכונים של משפחת אהרוני-מרלנג'ון</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f766e">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%230d9488'/%3E%3Cpath d='M256 112L96 248h48v152h224V248h48L256 112zm-32 232l-56-56 22-22 34 34 86-86 22 22-108 108z' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%230d9488'/%3E%3Cpath d='M256 112L96 248h48v152h224V248h48L256 112zm-32 232l-56-56 22-22 34 34 86-86 22 22-108 108z' fill='%23ffffff'/%3E%3C/svg%3E">
  
  <script src="/__/firebase/10.12.2/firebase-app-compat.js"></script>
  <script src="/__/firebase/10.12.2/firebase-auth-compat.js"></script>
  <script src="/__/firebase/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
    
    header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: white;
      padding: calc(14px + env(safe-area-inset-top)) 14px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    header h1 { margin: 0; font-size: 1.02rem; font-weight: 700; line-height: 1.25; }
    .header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .profile-btn {
      font-size: 0.76rem;
      background: rgba(255,255,255,0.22);
      color: white;
      border: 1px solid rgba(255,255,255,0.35);
      padding: 4px 9px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }
    .sync-pill { font-size: 0.72rem; background: rgba(255,255,255,0.18); padding: 4px 8px; border-radius: 20px; white-space: nowrap; }

    .container { max-width: 640px; margin: 0 auto; padding: 14px; }

    .chips-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; scrollbar-width: none; }
    .chips-row::-webkit-scrollbar { display: none; }
    .chip {
      background: white;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active { background: var(--primary); color: white; border-color: var(--primary); }

    .assignee-picker { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .assignee-label { font-size: 0.82rem; color: var(--muted); font-weight: 600; margin-left: 4px; }
    .pick-chip {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      color: var(--text);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }
    .pick-chip.selected { background: #0ea5e9; color: white; border-color: #0284c7; }

    .input-card {
      background: var(--card);
      padding: 14px;
      border-radius: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    input, select, textarea {
      padding: 11px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      background: #f8fafc;
      color: var(--text);
      width: 100%;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); background: white; }
    .grow { flex: 1; min-width: 140px; }
    .qty-input { width: 95px; }
